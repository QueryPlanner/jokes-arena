name: CI
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install approved dependencies and coverage
        run: |
          pip install --require-hashes -r requirements.txt
          pip install coverage==7.13.1
      - name: Python checks
        run: |
          python -m compileall -q arena scripts deployment
          python -m coverage run --source=arena,scripts,deployment -m unittest discover -s tests
          python -m coverage report --fail-under=100 -m
      - name: Frontend event tests
        run: node --test tests/frontend.test.cjs
      - name: Build and exercise production image
        env:
          REVISION: ${{ github.sha }}
        run: |
          docker build --build-arg REVISION="$REVISION" --tag jokes-arena:test .
          bash deployment/smoke.sh jokes-arena:test "$REVISION"
