name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jokes-arena-production
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Publish immutable image
        id: image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GH_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64 --build-arg REVISION="$REVISION" \
            --tag "ghcr.io/queryplanner/jokes-arena:$REVISION" --push --metadata-file image-metadata.json .
          digest=$(jq -r '."containerimage.digest"' image-metadata.json)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
  deploy:
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Connect using repository-specific Tailscale federation
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:jokesarena-ci
      - name: Deploy through the restricted SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          key_dir=$(mktemp -d)
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$key_dir/known_hosts"
          chmod 600 "$key_dir/key" "$key_dir/known_hosts"
          printf '%s\n' "$GHCR_TOKEN" | ssh -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$key_dir/known_hosts" \
            -i "$key_dir/key" appuser@100.124.202.79 "deploy $DIGEST $REVISION"
